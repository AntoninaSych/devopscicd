image:
  repository: <account>.dkr.ecr.<region>.amazonaws.com/django-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

resources: {}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

config:
  DJANGO_SECRET_KEY: "changeme"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"

ingress:
  enabled: true
  # ingress class name for controller (e.g. nginx, alb, traefik)
  className: nginx
  # primary host to route traffic
  host: yourdomain.com
  # base path to your app
  path: /
  pathType: Prefix
  # enable TLS with cert-manager
  tls: true
  # optional: override cert-manager cluster-issuer (defaults to letsencrypt-prod when tls is true)
  clusterIssuer: "letsencrypt-prod"
  # optional: custom secret name for TLS (leave empty to use auto-generated default)
  secretName: ""
