image:
  repository: 519904097991.dkr.ecr.us-east-1.amazonaws.com/ecr-repo-django-app
  tag: latest
  pullPolicy: IfNotPresent
#  pullPolicy: Always

service:
  type: LoadBalancer
  port: 8000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: false
