services:
  django:
    build:
      context: ./docker/django
      dockerfile: Dockerfile
    container_name: goit_django
    env_file:
      - ./docker/.env
    volumes:
      - ./docker/django:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:13
    container_name: goit_postgres
    env_file:
      - ./docker/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: goit_nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django
    restart: unless-stopped

volumes:
  pg_data:
